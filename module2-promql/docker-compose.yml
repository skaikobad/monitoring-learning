services:
  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    ports:
      - "9100:9100"
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml # The source file on your host machine:The destination path inside the container where the file will be placed
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-lifecycle'  # This enables the Prometheus API to reload the configuration file at runtime
    depends_on:
      - node_exporter
  demo-app:
    image:	julius/prometheus-demo-service:latest
    container_name:	demo_app
    ports:
      - "8080:8080"