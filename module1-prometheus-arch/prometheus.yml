# scrape configuration file for Prometheus server

# global config
global:
  scrape_interval:	15s
  evaluation_interval:	15s

# scrape config for Prometheus
scrape_configs:
  - job_name:	"prometheus"
    static_configs:
      - targets:	["localhost:9090"]
  - job_name:	"node"
    static_configs:
      - targets:	["node_exporter:9100"]